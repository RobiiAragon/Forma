name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: brew install cmake ninja || true

      - name: Build Metal Gaussian engine (iOS + Simulator)
        run: bash scripts/build_msplat.sh

      - name: Build macOS Gaussian worker
        run: bash Tools/build_gaussian_worker.sh

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 -oE 'MARKETING_VERSION = [0-9.]+' Forma.xcodeproj/project.pbxproj | awk '{print $3}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build Forma Desktop (macOS, Release)
        run: |
          xcodebuild -project Forma.xcodeproj -scheme FormaDesktop -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          APP="$(find DerivedData/mac -path '*Release/FormaDesktop.app' -maxdepth 6 | head -1)"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Forma-Desktop-${{ steps.v.outputs.version }}-macOS.zip"

      - name: Build Forma (iOS, unsigned IPA)
        run: |
          xcodebuild -project Forma.xcodeproj -scheme Forma -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          APP="$(find DerivedData/ios -path '*Release-iphoneos/Forma.app' -maxdepth 6 | head -1)"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "dist/Forma-${{ steps.v.outputs.version }}-iOS-unsigned.ipa" Payload

      - name: Checksums
        run: cd dist && shasum -a 256 * | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Forma
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Forma ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body_path: .github/RELEASE_NOTES.md
